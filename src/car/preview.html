<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horizon One — vehicle workshop</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b7c6ce;color:#fff;font:14px system-ui}canvas{display:block}#controls{position:absolute;top:18px;left:18px;display:flex;gap:8px;z-index:2}button{padding:9px 15px;color:#ecf0ed;background:#18262be6;border:1px solid #ffffff2b;border-radius:3px;font:inherit;cursor:pointer}#caption{position:absolute;bottom:24px;left:27px;font:12px system-ui;letter-spacing:.08em;color:#2c3b43}#readings{position:absolute;bottom:24px;right:27px;color:#2c3b43;font:14px monospace}</style></head><body>
<div id="controls"><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="rear">Rear</button><button data-view="cockpit">Cockpit</button><button id="state">High speed</button><button id="mood">Sunset</button></div><div id="caption">HORIZON ONE / ORIGINAL PARAMETRIC VEHICLE</div><div id="readings"></div>
<script type="module">
import * as THREE from 'three';
import {createCar} from '../car.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb5c8d6);scene.fog=new THREE.Fog(0xb5c8d6,23,65);
const envCanvas=document.createElement('canvas');envCanvas.width=1024;envCanvas.height=512;const ctx=envCanvas.getContext('2d');const grad=ctx.createLinearGradient(0,0,0,512);grad.addColorStop(0,'#6f9cc6');grad.addColorStop(.46,'#d8e4e8');grad.addColorStop(.51,'#9c9b85');grad.addColorStop(1,'#5c635c');ctx.fillStyle=grad;ctx.fillRect(0,0,1024,512);ctx.fillStyle='#fff6df';ctx.beginPath();ctx.ellipse(210,190,32,13,0,0,Math.PI*2);ctx.fill();const et=new THREE.CanvasTexture(envCanvas);et.mapping=THREE.EquirectangularReflectionMapping;et.colorSpace=THREE.SRGBColorSpace;const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(et).texture;scene.environmentIntensity=.45;
const hemi=new THREE.HemisphereLight(0xd9eeff,0x6b6351,.72);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff3dd,2.7);sun.position.set(4,7,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:20});sun.shadow.bias=-.0002;sun.shadow.normalBias=.02;scene.add(sun);const bounce=new THREE.DirectionalLight(0x9bd4ed,.55);bounce.position.set(-5,2,-3);scene.add(bounce);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x767e79,roughness:.92}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.y=-.007;scene.add(ground);
const car=createCar();scene.add(car.root);const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.025,200);
let view='front',fast=false,sunset=false;const idle={speed:0,steer:0,throttle:0,brake:0,rpm:1350,gear:'N',fuel:.94,coolant:78,odometer:0,turnSignal:0};const running={speed:48.5,steer:.15,throttle:.7,brake:0,rpm:8600,gear:4,fuel:.71,coolant:94,odometer:12480,turnSignal:1};
function setView(v){view=v;car.setView(v==='cockpit'?'cockpit':'chase');if(v==='cockpit'){camera.fov=62;camera.position.copy(car.cockpitCamera.position);camera.lookAt(camera.position.clone().add(new THREE.Vector3(0,-.018,1).applyQuaternion(car.cockpitCamera.quaternion)));}else{camera.fov=37;const positions={front:[4.7,2.1,6.3],side:[6.7,1.45,.12],rear:[4.6,2.05,-6.25]};camera.position.set(...positions[v]);camera.lookAt(0,.59,0);}camera.updateProjectionMatrix();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelector('#state').onclick=()=>{fast=!fast;document.querySelector('#state').textContent=fast?'Idle':'High speed';};document.querySelector('#mood').onclick=()=>{sunset=!sunset;scene.background.set(sunset?0xcda68d:0xb5c8d6);scene.fog.color.copy(scene.background);sun.color.set(sunset?0xffae6a:0xfff3dd);sun.position.set(sunset?-5:4,sunset?2.6:7,6);sun.intensity=sunset?2.45:2.7;hemi.intensity=sunset?.64:.72;};
window.vehiclePreview={car,camera,renderer,scene,setView,setState:(v)=>{fast=v;},getState:()=>fast?running:idle};setView('front');let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min((now-last)/1000,.04);last=now;car.update(dt,{...(fast?running:idle),time:now/1000});document.querySelector('#readings').textContent=fast?'175 km/h · 8600 rpm · 4 · 71% · 94°C · 12.48 km':'0 km/h · 1350 rpm · N · 94% · 78°C · 0.00 km';renderer.render(scene,camera);});
</script></body></html>
